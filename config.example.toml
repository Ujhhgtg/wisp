scrollback_limit = 100000

[font]
family = "monospace"
size = 11.0
ligatures = true

[window]
margin_width = 21.75

[colors]
background = "#000000"
foreground = "#ffffff"
cursor = "#ffffff"
selection_background = "#ffffff"
selection_foreground = "#000000"
color0 = "#000000"
color1 = "#cc0000"
color2 = "#4e9a06"
color3 = "#c4a000"
color4 = "#3465a4"
color5 = "#75507b"
color6 = "#06989a"
color7 = "#d3d7cf"
color8 = "#555753"
color9 = "#ef2929"
color10 = "#8ae234"
color11 = "#fce94f"
color12 = "#729fcf"
color13 = "#ad7fa8"
color14 = "#34e2e2"
color15 = "#eeeeec"

[cursor]
shape = "beam"
blink = true
smooth = true
trail = true
trail_duration_ms = 150

[mouse]
enabled = true
copy_on_select = false
hide_when_typing = true

[protocols]
kitty_keyboard = true
kitty_graphics = true
bracketed_paste = true
focus_events = true
hyperlinks = true
